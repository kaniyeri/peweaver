<text x="115" y="442" font-size="11" font-weight="700" fill="#0f172a">Key Scientific Takeaways:</text>
<text x="115" y="460" font-size="10.5" fill="#334155">1. <tspan font-weight="600">Implementer dominates</tspan>: Sol accepts 15/16 across all 4 planners; Gemini accepts 16/16 across all 4 planners.</text>
<text x="115" y="478" font-size="10.5" fill="#334155">2. <tspan font-weight="600">Route confound is massive</tspan>: Gemini native is 16/16; the exact same Gemini model via OpenRouter is 0/6 (token-truncation/transport failure).</text>
